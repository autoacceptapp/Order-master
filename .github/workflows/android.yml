name: Android CI & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ] || [ ! -d "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set or not a valid directory." >&2
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VER_OUTPUT}"
          
          MAJOR_VER=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${MAJOR_VER}" ] || ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to detect active Java major version." >&2
            exit 1
          fi

          echo "Active Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Active Java version (${MAJOR_VER}) is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verification successful (Java ${MAJOR_VER} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Permanent debug keystore
        run: |
          echo "=== Checking permanent debug keystore ==="
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring permanent debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists; skipping generation."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore or file is empty." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK with dynamic versioning
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "=== Building Debug APK ==="
          echo "Dynamic versionCode: ${{ github.run_number }}"
          echo "Dynamic versionName: 1.0.${{ github.run_number }}"
          gradle :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }} \
            --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          echo "=== Verifying built APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}!" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} exists but is empty (0 bytes)." >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}")
          echo "Verification SUCCESS: ${EXPECTED_APK} exists (size: ${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare direct APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing direct APK release asset ==="
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${ASSET_DIR}"

          # Ensure the uploaded asset filename is directly app-debug.apk for clean direct downloading
          ASSET_FILENAME="app-debug.apk"
          DEST_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp -p "app/build/outputs/apk/debug/app-debug.apk" "${DEST_PATH}"

          if [ ! -f "${DEST_PATH}" ] || [ ! -s "${DEST_PATH}" ]; then
            echo "ERROR: Prepared release asset ${DEST_PATH} is missing or empty." >&2
            exit 1
          fi

          echo "Prepared direct release asset: ${DEST_PATH} (${ASSET_FILENAME})"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Order Master v1.0.${{ github.run_number }} (Build #${{ github.run_number }})"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          body: |
            ### 🚀 Order Master Update v1.0.${{ github.run_number }}

            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Version Code**: `${{ github.run_number }}`
            - **Build Run**: #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
            - **Commit SHA**: `${{ github.sha }}`

            #### 📦 Direct Download
            - [Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)
          files: |
            ${{ steps.prepare_asset.outputs.asset_path }}
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Final APK Download & Release Report ==="
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release successfully published!"
            gh release view "${RELEASE_TAG}" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            DIRECT_APK_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
            LATEST_DIRECT_APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/${ASSET_NAME}"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`1.0.${{ github.run_number }}\` (code: \`${{ github.run_number }}\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download URL**: [Download ${ASSET_NAME}](${DIRECT_APK_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Permanent Latest URL**: [Download Latest APK](${LATEST_DIRECT_APK_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [View GitHub Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "### ⚠️ Debug APK Build Succeeded (Release Notice)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build Status**: Succeeded with versionCode ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact**: Preserved as \`app-debug-apk\` under workflow summary" >> $GITHUB_STEP_SUMMARY
          fi
