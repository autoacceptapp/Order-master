name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ] || [ ! -d "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set or not a valid directory." >&2
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VER_OUTPUT}"
          
          # Extract major version
          MAJOR_VER=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "${MAJOR_VER}" ] || ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to detect active Java major version." >&2
            exit 1
          fi

          echo "Active Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Active Java version (${MAJOR_VER}) is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verification successful (Java ${MAJOR_VER} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking temporary debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists; skipping generation."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore or file is empty." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug -PVERSION_CODE=${{ github.run_number }} --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying built APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}!" >&2
            echo "Searching exclusively in app/build/outputs/apk/ for diagnostic output:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} exists but is empty (0 bytes)." >&2
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "ERROR: ${EXPECTED_APK} does not have .apk extension." >&2; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}")
          echo "Verification SUCCESS: ${EXPECTED_APK} exists (size: ${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK release asset ==="
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${ASSET_DIR}"

          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp -p "app/build/outputs/apk/debug/app-debug.apk" "${DEST_PATH}"

          if [ ! -f "${DEST_PATH}" ] || [ ! -s "${DEST_PATH}" ]; then
            echo "ERROR: Prepared release asset ${DEST_PATH} is missing or empty." >&2
            exit 1
          fi

          echo "Prepared release asset: ${DEST_PATH}"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset does not exist or is empty at '${ASSET_PATH}'." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating release tag: ${RELEASE_TAG}"
          echo "Release title: ${RELEASE_TITLE}"

          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Intended Use**: For testing and verification only
          - **Release Status**: Not a Play Store production release
          - **Signing**: Signed exclusively with a temporary debug keystore
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Final APK Download & Release Report ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release successfully published!"
            gh release view "${RELEASE_TAG}" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "Asset Filename: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release Page**: [View Release & Download APK](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Download Instructions**: Download \`${ASSET_NAME}\` directly from the **Assets** section of the release page onto your Android device." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact**: The standard GitHub Actions artifact \`app-debug-apk\` is also available under the workflow run summary." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "The debug APK build completed successfully, and the GitHub Actions artifact 'app-debug-apk' is preserved."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build Status**: Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Publishing**: Not completed (check repository permissions or workflow settings)" >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Download**: The debug APK is safely preserved as a normal GitHub Actions artifact named \`app-debug-apk\` under this workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
