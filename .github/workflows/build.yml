name: Build & Publish APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# CRITICAL FIX 1: Explicit workflow-level permissions
# GitHub Actions requires 'contents: write' to create releases, push git tags, and upload APK assets.
permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    # Job-level permissions redundancy to ensure token has write access
    permissions:
      contents: write

    steps:
      # Step 1: Checkout repository
      # Uses actions/checkout@v4 (latest, fully compatible with modern GitHub runners)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java 17 Development Kit
      # Uses actions/setup-java@v4 with Temurin distribution for stable Android Gradle Plugin 8.x / 9.x builds
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Setup Gradle
      # Uses gradle/actions/setup-gradle@v4 (upgraded to eliminate deprecation warnings)
      - name: Set up Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # Step 4: Decode Permanent Keystores & Google Services from GitHub Secrets
      - name: Decode Secrets and Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "=== Setting up Keystore & Google Services Secrets ==="

          # Decode secrets.KEYSTORE_BASE64 into app/release.jks
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Decoding KEYSTORE_BASE64 into app/release.jks..."
            echo "${KEYSTORE_BASE64}" | base64 -d > app/release.jks
            if [ -s "app/release.jks" ]; then
              echo "✅ app/release.jks decoded successfully ($(stat -c%s app/release.jks) bytes)."
            else
              echo "❌ ERROR: Decoded app/release.jks is empty!" >&2
              exit 1
            fi
          else
            echo "⚠️ Notice: KEYSTORE_BASE64 secret not found in repository secrets."
          fi

          # Write secrets.GOOGLE_SERVICES_JSON directly into app/google-services.json
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "Writing GOOGLE_SERVICES_JSON directly into app/google-services.json..."
            echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json
            echo "✅ app/google-services.json written successfully ($(stat -c%s app/google-services.json) bytes)."
          else
            echo "⚠️ Notice: GOOGLE_SERVICES_JSON secret not found in repository secrets."
          fi

          # Restore fallback debug.keystore from repository base64 if present
          if [ -f "./debug.keystore.base64" ] && [ ! -f "./debug.keystore" ]; then
            echo "Restoring permanent debug.keystore from ./debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
            echo "✅ Permanent debug.keystore restored ($(stat -c%s ./debug.keystore) bytes)."
          elif [ -f "./debug.keystore" ]; then
            echo "Found existing ./debug.keystore."
          fi

      # Step 5: Verify Static SHA-1 Fingerprints of the Keystores
      - name: Verify Keystore SHA-1 Fingerprints
        run: |
          echo "=== Verifying Keystore Integrity & Static SHA-1 Fingerprint ==="
          if [ -f "app/release.jks" ]; then
            echo "--- Release Keystore Certificate Info (release.jks) ---"
            keytool -list -v -keystore app/release.jks -storepass android 2>/dev/null | grep -E "Alias name:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:" || echo "Keystore readable with custom or default credentials"
          fi

          if [ -f "./debug.keystore" ]; then
            echo "--- Debug Keystore Certificate Info (debug.keystore) ---"
            keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "Alias name:|Owner:|SHA1:|SHA256:" || true
          fi

      # Step 6: Calculate Version Info
      - name: Prepare Dynamic Version Metadata
        id: version_meta
        run: |
          # Compute SemVer and build numbers
          BUILD_NUM="${{ github.run_number }}"
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_CODE="${BUILD_NUM}"
          
          # If triggered by a Git Tag (e.g., v1.1.0), extract version from tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Computed Tag: ${RELEASE_TAG} (Code: ${VERSION_CODE})"

      # Step 7: Make gradlew executable
      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # Step 8: Compile and Assemble Release APK
      - name: Build Release APK with Gradle
        env:
          VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
        run: |
          echo "=== Building Release APK with Gradle Wrapper ==="
          ./gradlew assembleRelease --stacktrace --no-daemon

      # Step 9: Verify and Locate Generated APKs
      - name: Verify Generated APK Outputs
        id: verify_apk
        run: |
          echo "=== Locating Built APKs ==="
          mkdir -p release_assets

          # Locate Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "${RELEASE_APK}" ] && [ -f "${RELEASE_APK}" ]; then
            echo "Found Release APK: ${RELEASE_APK} ($(stat -c%s "${RELEASE_APK}") bytes)"
            cp "${RELEASE_APK}" release_assets/OrderMaster-${{ steps.version_meta.outputs.release_tag }}-release.apk
            cp "${RELEASE_APK}" release_assets/app-release.apk
            echo "has_release_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_apk=false" >> "$GITHUB_OUTPUT"
          fi

          TOTAL_APKS=$(find release_assets/ -type f -name "*.apk" | wc -l)
          if [ "${TOTAL_APKS}" -eq 0 ]; then
            echo "ERROR: No APK files found in app/build/outputs/apk!" >&2
            exit 1
          fi

          echo "Successfully verified ${TOTAL_APKS} APK file(s) ready for release."
          ls -lh release_assets/

      # Step 9: Upload Artifact to GitHub Actions Run
      # Uses actions/upload-artifact@v4 (latest version, resolves Node.js deprecations)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderMaster-APKs-${{ steps.version_meta.outputs.release_tag }}
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      # Step 10: Publish APK to GitHub Releases
      # Uses softprops/action-gh-release@v2 (upgraded to v2; runs natively on Node.js 20+)
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "Order Master ${{ steps.version_meta.outputs.release_tag }} (Build #${{ steps.version_meta.outputs.version_code }})"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          body: |
            ### 🚀 Order Master ${{ steps.version_meta.outputs.release_tag }}

            - **Version Name**: `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code**: `${{ steps.version_meta.outputs.version_code }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Run**: #${{ github.run_number }}

            #### 📦 Download Assets
            - Release APK: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_meta.outputs.release_tag }}/app-release.apk)
          files: |
            release_assets/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      # Step 11: Summary Reporting
      - name: Generate Workflow Step Summary
        if: always()
        run: |
          echo "## 📱 Order Master Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.version_meta.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: \`${{ steps.version_meta.outputs.version_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: [Download app-release.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk)" >> $GITHUB_STEP_SUMMARY

