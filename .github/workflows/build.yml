name: Build & Publish APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type to assemble and publish'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

# Explicit workflow-level permissions for creating releases, tags, and uploading APK assets
permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build-and-release:
    name: Build & Release APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java 17 Development Kit
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Gradle
      - name: Set up Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # Step 4: Decode Permanent Keystores & Google Services from GitHub Secrets
      - name: Decode Secrets and Keystores
        id: decode_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "=== Setting up Keystore & Google Services Secrets ==="

          # 1: Firebase Google Services JSON
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "Writing GOOGLE_SERVICES_JSON directly into app/google-services.json..."
            printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
            echo "✅ app/google-services.json written from secret ($(stat -c%s app/google-services.json) bytes)."
          elif [ -f "app/google-services.json" ]; then
            echo "✅ Using existing app/google-services.json from repository ($(stat -c%s app/google-services.json) bytes)."
          else
            echo "⚠️ Warning: app/google-services.json not found; build will proceed with fallback."
          fi

          # 2: Release & Debug Keystores
          CUSTOM_KEYSTORE="false"
          CLEAN_KEYSTORE_B64="$(printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n ')"
          if [ -n "${CLEAN_KEYSTORE_B64}" ]; then
            echo "Decoding KEYSTORE_BASE64 into app/release.jks..."
            if printf '%s' "${CLEAN_KEYSTORE_B64}" | base64 -d > app/release.jks && [ -s app/release.jks ]; then
              CUSTOM_KEYSTORE="true"
              cp app/release.jks ./debug.keystore 2>/dev/null || true
              cp app/release.jks app/debug.keystore 2>/dev/null || true
              echo "✅ app/release.jks decoded successfully ($(stat -c%s app/release.jks) bytes)."
            else
              echo "::warning::KEYSTORE_BASE64 secret could not be decoded. Falling back to debug keystore."
              rm -f app/release.jks
            fi
          fi

          # Ensure ./debug.keystore is ALWAYS guaranteed to exist on the runner
          if [ ! -s "./debug.keystore" ]; then
            if [ -f "./debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore
            elif [ -s "app/release.jks" ]; then
              echo "Copying app/release.jks to ./debug.keystore..."
              cp app/release.jks ./debug.keystore
            else
              echo "Generating fallback debug.keystore with keytool..."
              keytool -genkeypair -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Ensure app/debug.keystore is also in place
          cp ./debug.keystore app/debug.keystore 2>/dev/null || true

          # If app/release.jks is not present, use ./debug.keystore
          if [ ! -s "app/release.jks" ]; then
            echo "Setting up app/release.jks from ./debug.keystore..."
            cp ./debug.keystore app/release.jks
          fi
          echo "custom_keystore=${CUSTOM_KEYSTORE}" >> "$GITHUB_OUTPUT"

      # Step 5: Verify Static SHA-1 Fingerprints of the Keystores
      - name: Verify Keystore SHA-1 Fingerprints
        run: |
          echo "=== Verifying Keystore Integrity & Static SHA-1 Fingerprint ==="
          if [ -f "app/release.jks" ]; then
            echo "--- Release Keystore Certificate Info (release.jks) ---"
            keytool -list -v -keystore app/release.jks -storepass android 2>/dev/null | grep -E "Alias name:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:" || echo "Custom release keystore detected"
          fi

          if [ -f "./debug.keystore" ]; then
            echo "--- Debug Keystore Certificate Info (debug.keystore) ---"
            keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "Alias name:|Owner:|SHA1:|SHA256:" || true
          fi

      # Step 6: Calculate Version Info
      - name: Prepare Dynamic Version Metadata
        id: version_meta
        env:
          BUILD_TYPE_INPUT: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${BUILD_TYPE_INPUT:-release}"
          if [ "${BUILD_TYPE}" != "debug" ]; then
            BUILD_TYPE="release"
          fi

          # 1. Monotonic Version Code: Strictly increases on every build (never drops or freezes at RUN_NUM >= 102)
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((100 + RUN_NUM))

          # 2. Extract Base Semantic Version Name from gradle.properties
          BASE_VERSION_NAME=$(grep -E "^VERSION_NAME=" gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' "\r\n' || true)
          if [ -z "${BASE_VERSION_NAME}" ]; then
            BASE_VERSION_NAME="1.0.2"
          fi

          if [ "${BUILD_TYPE}" = "debug" ]; then
            VERSION_NAME="${BASE_VERSION_NAME}-debug"
            RELEASE_TAG="v${BASE_VERSION_NAME}-debug-build-${VERSION_CODE}"
            IS_PRERELEASE="true"
            MAKE_LATEST="false"
            APK_FILENAME="app-debug.apk"
          else
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              RELEASE_TAG="${GITHUB_REF#refs/tags/}"
              VERSION_NAME="${RELEASE_TAG#v}"
            elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RELEASE_TAG="${GITHUB_REF#refs/tags/}"
              VERSION_NAME="${RELEASE_TAG}"
            else
              VERSION_NAME="${BASE_VERSION_NAME}"
              RELEASE_TAG="v${VERSION_NAME}-build-${VERSION_CODE}"
            fi
            IS_PRERELEASE="false"
            MAKE_LATEST="true"
            APK_FILENAME="app-release.apk"
          fi

          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Computed Build Type: ${BUILD_TYPE}"
          echo "Computed Release Tag: ${RELEASE_TAG}"
          echo "Computed Version Name: ${VERSION_NAME}"
          echo "Computed Version Code: ${VERSION_CODE}"

      # Step 7: Make gradlew executable
      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # Step 8: Compile and Assemble APK
      - name: Build APK with Gradle
        env:
          BUILD_TYPE: ${{ steps.version_meta.outputs.build_type }}
          VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_FALLBACK_API_KEY: ${{ secrets.FIREBASE_FALLBACK_API_KEY }}
          CUSTOM_KEYSTORE: ${{ steps.decode_secrets.outputs.custom_keystore }}
        run: |
          echo "=== Building ${BUILD_TYPE} APK ==="

          # Strip accidental \r/\n from mobile copy-pasted secrets
          KEYSTORE_PASSWORD="$(printf '%s' "${KEYSTORE_PASSWORD:-}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${KEY_ALIAS:-}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-}" | tr -d '\r\n')"
          FIREBASE_FALLBACK_API_KEY="$(printf '%s' "${FIREBASE_FALLBACK_API_KEY:-}" | tr -d '\r\n')"
          export FIREBASE_FALLBACK_API_KEY

          # Determine and test valid signing credentials before launching Gradle
          TARGET_PASS="${KEYSTORE_PASSWORD:-android}"
          TARGET_ALIAS="${KEY_ALIAS:-androiddebugkey}"
          TARGET_KEYPASS="${KEY_PASSWORD:-$TARGET_PASS}"

          # Guarantee both keystore files exist
          if [ ! -s "app/release.jks" ] && [ -s "./debug.keystore" ]; then
            cp ./debug.keystore app/release.jks
          fi
          if [ ! -s "./debug.keystore" ] && [ -s "app/release.jks" ]; then
            cp app/release.jks ./debug.keystore
          fi
          cp ./debug.keystore app/debug.keystore 2>/dev/null || true

          if [ -f "app/release.jks" ]; then
            if ! keytool -list -keystore app/release.jks -storepass "${TARGET_PASS}" >/dev/null 2>&1; then
              if keytool -list -keystore app/release.jks -storepass android >/dev/null 2>&1; then
                echo "Notice: Configured keystore password failed, but 'android' unlocked app/release.jks. Falling back to 'android'."
                TARGET_PASS="android"
                TARGET_ALIAS="androiddebugkey"
                TARGET_KEYPASS="android"
              else
                echo "::warning::Cannot unlock app/release.jks with KEYSTORE_PASSWORD or 'android'. Using ./debug.keystore."
                cp ./debug.keystore app/release.jks
                TARGET_PASS="android"
                TARGET_ALIAS="androiddebugkey"
                TARGET_KEYPASS="android"
              fi
            fi

            if [ -f "app/release.jks" ]; then
              if [ -z "${TARGET_ALIAS}" ] || ! keytool -list -keystore app/release.jks -storepass "${TARGET_PASS}" -alias "${TARGET_ALIAS}" >/dev/null 2>&1; then
                DETECTED_ALIAS=$(keytool -list -v -keystore app/release.jks -storepass "${TARGET_PASS}" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: *//I')
                if [ -n "${DETECTED_ALIAS}" ]; then
                  echo "Notice: Using detected keystore alias: ${DETECTED_ALIAS}"
                  TARGET_ALIAS="${DETECTED_ALIAS}"
                else
                  TARGET_ALIAS="androiddebugkey"
                fi
              fi

              if [ -z "${TARGET_KEYPASS}" ]; then
                TARGET_KEYPASS="${TARGET_PASS}"
              fi

              if ! keytool -importkeystore -srckeystore app/release.jks -srcstorepass "${TARGET_PASS}" -srcalias "${TARGET_ALIAS}" -srckeypass "${TARGET_KEYPASS}" -destkeystore /tmp/keycheck.p12 -deststoretype PKCS12 -deststorepass "check123" -noprompt >/dev/null 2>&1; then
                rm -f /tmp/keycheck.p12
                if [ "${TARGET_KEYPASS}" != "android" ] && keytool -importkeystore -srckeystore app/release.jks -srcstorepass "${TARGET_PASS}" -srcalias "${TARGET_ALIAS}" -srckeypass "android" -destkeystore /tmp/keycheck.p12 -deststoretype PKCS12 -deststorepass "check123" -noprompt >/dev/null 2>&1; then
                  echo "Notice: KEY_PASSWORD was incorrect, but key opened with 'android'. Using 'android'."
                  TARGET_KEYPASS="android"
                else
                  echo "::warning::Keystore unlocked, but key password for alias '${TARGET_ALIAS}' is incorrect. Using debug keystore."
                  cp ./debug.keystore app/release.jks
                  TARGET_PASS="android"
                  TARGET_ALIAS="androiddebugkey"
                  TARGET_KEYPASS="android"
                fi
              fi
              rm -f /tmp/keycheck.p12
            fi
          fi

          export KEYSTORE_PASSWORD="${TARGET_PASS}"
          export STORE_PASSWORD="${TARGET_PASS}"
          export KEY_ALIAS="${TARGET_ALIAS}"
          export KEY_PASSWORD="${TARGET_KEYPASS}"

          if [ "${BUILD_TYPE}" = "debug" ]; then
            GRADLE_TASK="assembleDebug"
          else
            GRADLE_TASK="assembleRelease"
          fi

          if command -v gradle >/dev/null 2>&1; then
            echo "Using pre-installed Gradle CLI ($(gradle --version | head -n 3 | tr '\n' ' '))"
            gradle "${GRADLE_TASK}" --stacktrace
          else
            echo "Falling back to Gradle Wrapper..."
            ./gradlew "${GRADLE_TASK}" --stacktrace
          fi

      # Step 9: Verify and Locate Generated APKs
      - name: Verify Generated APK Outputs
        id: verify_apk
        env:
          BUILD_TYPE: ${{ steps.version_meta.outputs.build_type }}
          RELEASE_TAG: ${{ steps.version_meta.outputs.release_tag }}
        run: |
          echo "=== Locating Built APKs (${BUILD_TYPE}) ==="
          mkdir -p release_assets

          if [ "${BUILD_TYPE}" = "debug" ]; then
            BUILT_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "${BUILT_APK}" ] && [ -f "${BUILT_APK}" ]; then
              echo "Found Debug APK: ${BUILT_APK} ($(stat -c%s "${BUILT_APK}") bytes)"
              cp "${BUILT_APK}" "release_assets/OrderMaster-${RELEASE_TAG}-debug.apk"
              cp "${BUILT_APK}" "release_assets/app-debug.apk"
            fi
          else
            BUILT_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "${BUILT_APK}" ] && [ -f "${BUILT_APK}" ]; then
              echo "Found Release APK: ${BUILT_APK} ($(stat -c%s "${BUILT_APK}") bytes)"
              cp "${BUILT_APK}" "release_assets/OrderMaster-${RELEASE_TAG}-release.apk"
              cp "${BUILT_APK}" "release_assets/app-release.apk"
            fi
          fi

          TOTAL_APKS=$(find release_assets/ -type f -name "*.apk" | wc -l)
          if [ "${TOTAL_APKS}" -eq 0 ]; then
            echo "ERROR: No APK files found in app/build/outputs/apk/${BUILD_TYPE}!" >&2
            exit 1
          fi

          echo "Successfully verified ${TOTAL_APKS} APK file(s) ready for release."
          ls -lh release_assets/

      # Step 10: Upload Artifact to GitHub Actions Run
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderMaster-APKs-${{ steps.version_meta.outputs.release_tag }}
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      # Step 11: Publish APK to GitHub Releases
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "Order Master ${{ steps.version_meta.outputs.release_tag }} (Build #${{ steps.version_meta.outputs.version_code }})"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.version_meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version_meta.outputs.make_latest }}
          generate_release_notes: false
          body: |
            ### 🚀 Order Master ${{ steps.version_meta.outputs.release_tag }}

            - **Build Type**: `${{ steps.version_meta.outputs.build_type }}`
            - **Version Name**: `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code**: `${{ steps.version_meta.outputs.version_code }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Run**: #${{ github.run_number }}

            #### 📦 Download Assets
            - APK: [`${{ steps.version_meta.outputs.apk_filename }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_meta.outputs.release_tag }}/${{ steps.version_meta.outputs.apk_filename }})
          files: |
            release_assets/*.apk
          fail_on_unmatched_files: true

      # Step 12: Summary Reporting
      - name: Generate Workflow Step Summary
        if: always()
        run: |
          echo "## 📱 Order Master Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: \`${{ steps.version_meta.outputs.build_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.version_meta.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: \`${{ steps.version_meta.outputs.version_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Download**: [Download ${{ steps.version_meta.outputs.apk_filename }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_meta.outputs.release_tag }}/${{ steps.version_meta.outputs.apk_filename }})" >> $GITHUB_STEP_SUMMARY
